name: Build et release Memento Agent

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes de version (markdown)"
        required: false
        default: ""

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Verifier la branche (dev ou prod uniquement)
        shell: bash
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branche source: $BRANCH"
          if [ "$BRANCH" != "dev" ] && [ "$BRANCH" != "prod" ]; then
            echo "ERREUR: ce workflow ne peut etre lance que depuis 'dev' ou 'prod' (branche actuelle: $BRANCH)"
            exit 1
          fi
          if [ "$BRANCH" = "dev" ]; then
            echo "prerelease=true" >> $GITHUB_ENV
            echo "channel=dev (pre-release)" >> $GITHUB_STEP_SUMMARY
          else
            echo "prerelease=false" >> $GITHUB_ENV
            echo "channel=prod (release)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "branch=$BRANCH" >> $GITHUB_ENV

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lire la version depuis version.py
        shell: bash
        run: |
          VERSION=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' version.py)
          if [ -z "$VERSION" ]; then
            echo "ERREUR: impossible de lire VERSION dans version.py"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_ENV
          echo "Version detectee: $VERSION (tag: $TAG)"

      - name: Verifier que le tag n'existe pas deja
        shell: bash
        run: |
          if git ls-remote --tags origin "$tag" | grep -q "$tag"; then
            echo "ERREUR: le tag $tag existe deja sur origin. Bump VERSION dans version.py avant de relancer."
            exit 1
          fi

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 requests pywin32

      - name: Build du .exe avec PyInstaller
        shell: bash
        run: |
          pyinstaller --clean --noconfirm MementoAgent.spec
          if [ ! -f "dist/MementoAgent.exe" ]; then
            echo "ERREUR: dist/MementoAgent.exe introuvable apres le build PyInstaller"
            ls -la dist/ || true
            exit 1
          fi
          SIZE=$(stat -c%s "dist/MementoAgent.exe")
          echo "Build PyInstaller OK: dist/MementoAgent.exe ($SIZE octets)"

      - name: Creer un .env vide pour Inno Setup
        shell: bash
        run: |
          # installer.iss reference .env avec onlyifdoesntexist
          # un stub vide est suffisant : la borne le remplit au 1er lancement via le setup wizard
          touch .env

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe introuvable apres installation"
            exit 1
          }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build de l'installeur Inno Setup
        shell: pwsh
        run: |
          & "$env:ISCC" installer.iss
          $setup = "installer_output\MementoAgent_Setup_$env:version.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "Installeur introuvable: $setup"
            Get-ChildItem installer_output\ -ErrorAction SilentlyContinue
            exit 1
          }
          $size = (Get-Item $setup).Length
          Write-Host "Installeur OK: $setup ($size octets)"
          echo "setup_path=$setup" >> $env:GITHUB_ENV
          echo "setup_name=MementoAgent_Setup_$env:version.exe" >> $env:GITHUB_ENV

      - name: Creer le tag git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag depuis $branch"
          git push origin "$tag"

      - name: Creer la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Release $tag depuis la branche $branch."
          fi

          PRERELEASE_FLAG=""
          TITLE_SUFFIX=""
          if [ "$prerelease" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE_SUFFIX=" (pre-release)"
          fi

          gh release create "$tag" \
            "$setup_path" \
            --target "$branch" \
            --title "Memento Agent $tag$TITLE_SUFFIX" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG

          echo "Release creee: $tag (prerelease=$prerelease, branche=$branch, asset=$setup_name)"
