name: Mise a jour Supabase apres release

on:
  release:
    types: [published]

jobs:
  update-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les infos de la release
        id: release_info
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          ASSETS_JSON='${{ toJSON(github.event.release.assets) }}'
          # Utiliser l'URL API de l'asset (pas browser_download_url qui 404 sur repo prive)
          ASSET_API_URL=$(echo "$ASSETS_JSON" | jq -r '.[] | select(.name | endswith(".exe")) | .url' | head -1)
          EXE_NAME=$(echo "$ASSETS_JSON" | jq -r '.[] | select(.name | endswith(".exe")) | .name' | head -1)

          if [ -z "$ASSET_API_URL" ] || [ "$ASSET_API_URL" = "null" ]; then
            echo "Aucun fichier .exe trouve dans la release"
            exit 1
          fi

          echo "asset_api_url=$ASSET_API_URL" >> $GITHUB_OUTPUT
          echo "exe_name=$EXE_NAME" >> $GITHUB_OUTPUT
          echo "Fichier: $EXE_NAME"
          echo "API URL: $ASSET_API_URL"

      - name: Telecharger le exe depuis GitHub API
        run: |
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/${{ steps.release_info.outputs.exe_name }} \
            "${{ steps.release_info.outputs.asset_api_url }}"

          SIZE=$(stat -c%s "/tmp/${{ steps.release_info.outputs.exe_name }}")
          echo "Telecharge: $SIZE octets"

          if [ "$SIZE" -lt 1000 ]; then
            echo "ERREUR: fichier trop petit ($SIZE octets), le telechargement a echoue"
            cat /tmp/${{ steps.release_info.outputs.exe_name }}
            exit 1
          fi

      - name: Uploader dans Supabase Storage
        run: |
          EXE_NAME="${{ steps.release_info.outputs.exe_name }}"

          HTTP_CODE=$(curl -s -o /tmp/upload_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/updates/$EXE_NAME" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @/tmp/$EXE_NAME)

          echo "Upload HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Erreur upload Supabase Storage"
            cat /tmp/upload_response.txt
            exit 1
          fi

          echo "Upload OK dans Supabase Storage"

      - name: Mettre a jour la table updates
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"
          EXE_NAME="${{ steps.release_info.outputs.exe_name }}"
          STORAGE_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/updates/$EXE_NAME"
          NOTES=$(echo '${{ github.event.release.body }}' | head -c 500)

          JSON_BODY=$(jq -n \
            --arg version "$VERSION" \
            --arg fichier_url "$STORAGE_URL" \
            --arg notes "$NOTES" \
            '{version: $version, fichier_url: $fichier_url, notes: $notes, publiee_at: (now | todate)}')

          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/updates" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d "$JSON_BODY")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Table updates OK: v$VERSION -> $STORAGE_URL"
          else
            echo "Erreur Supabase table updates (code $HTTP_CODE)"
            cat /tmp/response.json
            exit 1
          fi

      - name: Nettoyer anciennes versions (garder 3)
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}"

          FILES=$(curl -s \
            -X POST "$SUPABASE_URL/storage/v1/object/list/updates" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":100,"offset":0,"sortBy":{"column":"created_at","order":"desc"}}')

          TOTAL=$(echo "$FILES" | jq '[.[] | select(.name | endswith(".exe"))] | length')
          echo "Total fichiers exe dans le bucket: $TOTAL"

          if [ "$TOTAL" -gt 3 ]; then
            TO_DELETE=$(echo "$FILES" | jq -r '[.[] | select(.name | endswith(".exe"))] | sort_by(.created_at) | reverse | .[3:] | .[].name')

            for FILE in $TO_DELETE; do
              echo "Suppression ancienne version: $FILE"
              curl -s -o /dev/null \
                -X DELETE "$SUPABASE_URL/storage/v1/object/updates/$FILE" \
                -H "apikey: $SUPABASE_KEY" \
                -H "Authorization: Bearer $SUPABASE_KEY"
            done
            echo "Nettoyage termine"
          else
            echo "Moins de 4 fichiers, rien a supprimer"
          fi
